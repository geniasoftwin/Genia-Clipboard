name: Feature request
description: Предложить улучшение GeniaClipboard
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
      description: Опишите сценарий использования, а не только желаемую кнопку или настройку.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы или дополнительные детали
