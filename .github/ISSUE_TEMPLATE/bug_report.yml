name: Bug report / Сообщить об ошибке
description: Report a GeniaClipboard bug / Сообщить об ошибке GeniaClipboard
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never include real passwords, tokens, personal data, sensitive clipboard content or files from the Data folder.
        Спасибо за отчёт. Не прикладывайте реальные пароли, токены, персональные данные, содержимое буфера или файлы из папки Data.
  - type: input
    id: version
    attributes:
      label: GeniaClipboard version / Версия
      placeholder: "0.5.6"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Версия Windows
      placeholder: "Windows 11 x64, 125% scaling"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional information / Дополнительная информация
      description: Use dummy test text only. Never upload history.gch, history.key, or password screenshots. / Используйте тестовый текст; не загружайте файлы Vault или скриншоты с паролями.
