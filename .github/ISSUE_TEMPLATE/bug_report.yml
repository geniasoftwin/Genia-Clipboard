name: Bug report
description: Сообщить об ошибке GeniaClipboard
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не вставляйте реальные пароли, токены, персональные данные или чувствительное содержимое буфера обмена.
  - type: input
    id: version
    attributes:
      label: Версия GeniaClipboard
      placeholder: "0.4.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Дополнительная информация
      description: Скриншоты и логи допустимы только после удаления чувствительных данных.
