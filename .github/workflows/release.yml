name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release current version
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content GeniaClipboard.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version was not found in GeniaClipboard.csproj"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check whether release exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Restore
        if: steps.release_check.outputs.exists != 'true'
        run: dotnet restore GeniaClipboard.csproj

      - name: Publish
        if: steps.release_check.outputs.exists != 'true'
        run: dotnet publish GeniaClipboard.csproj -c Release --no-restore

      - name: Create portable ZIP
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $publish = "bin\Release\net8.0-windows\win-x64\publish"
          $package = "dist\GeniaClipboard-win-x64"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "$publish\GeniaClipboard.exe" "$package\GeniaClipboard.exe" -Force
          Copy-Item "README.md" "$package\README.md" -Force
          Copy-Item "README_RU.md" "$package\README_RU.md" -Force
          Copy-Item "LICENSE" "$package\LICENSE" -Force
          Compress-Archive -Path "$package\*" -DestinationPath "dist\GeniaClipboard-win-x64.zip" -Force
          $zipHash = (Get-FileHash "dist\GeniaClipboard-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "$package\GeniaClipboard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  GeniaClipboard-win-x64.zip"
            "$exeHash  GeniaClipboard.exe"
          ) | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" "dist\GeniaClipboard-win-x64.zip" "dist\GeniaClipboard-win-x64\GeniaClipboard.exe" "dist\SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "GeniaClipboard v$env:VERSION" --notes-file "RELEASE_NOTES.md"
