name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GeniaClipboard.csproj

      - name: Publish
        run: dotnet publish GeniaClipboard.csproj -c Release --no-restore

      - name: Upload portable EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GeniaClipboard-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/GeniaClipboard.exe
          if-no-files-found: error
          retention-days: 14
